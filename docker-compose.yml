services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - renest-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL: inside the compose network the DB is
      # reachable as `db`, not `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Local/e2e stack only: seed the pre-created accounts and categories on start (idempotent).
      SEED_ON_START: 'true'
      # Requests reach the container from the Docker bridge (a private range), not loopback, so the
      # forwarded client IP is only honored if private ranges are trusted. Local stack only.
      TRUST_PROXY: 'loopback, uniquelocal'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  renest-db:
